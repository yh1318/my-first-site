<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杯趣创饮</title>
<style>
:root{--primary:#ff677d;--gray-bg:#f5f5f5}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--gray-bg);font-family:system-ui}
.container{max-width:430px;margin:auto;background:#fff;min-height:100vh}
.top-bar{background:var(--primary);color:#fff;text-align:center;padding:14px;font-weight:bold}
.page-content{padding:15px;display:none}
.page-content.active{display:block}
.banner{background:linear-gradient(135deg,#ff9a9e,#fad0c4);color:#fff;padding:25px;border-radius:20px;text-align:center;margin:10px 0}
.fun-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.fun-item{background:#fef2f4;color:var(--primary);padding:15px;text-align:center;border-radius:16px}
.cup-card{background:#fff;padding:15px;border-radius:16px;margin:10px 0;box-shadow:0 2px 5px #00000008}
.input-box{width:100%;padding:14px;border-radius:20px;border:1px solid #eee;margin:10px 0}
.btn{width:100%;background:var(--primary);color:#fff;padding:15px;border:none;border-radius:25px;font-weight:bold}
.tab-bar{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:auto;background:#fff;display:flex;padding:10px 0;border-top:1px solid #eee}
.tab-item{flex:1;text-align:center;color:#999}
.tab-item.active{color:var(--primary)}
</style>
</head>
<body>
<div class="container">
<div class="top-bar">杯趣创饮</div>
<div class="page-content active" id="page1">
<div class="banner">AI定制专属奶茶杯<br><small>循环复用 · 低碳生活</small></div>
<div class="fun-box">
<div class="fun-item" onclick="go(2)">AI一键创杯</div>
<div class="fun-item" onclick="go(4)">环保杯</div>
<div class="fun-item" onclick="go(3)">创意投稿</div>
<div class="fun-item">门店优惠</div>
</div>
<div class="cup-card">国潮古风定制杯 | 密封防漏可循环</div>
<div class="cup-card">ins简约风杯 | 可做花瓶</div>
</div>
<div class="page-content" id="page2">
<input class="input-box" placeholder="输入灵感">
<button class="btn">AI生成设计</button>
</div>
<div class="page-content" id="page3">
<input class="input-box" placeholder="写下创意">
<button class="btn">发布投稿</button>
</div>
<div class="page-content" id="page4">
<div class="cup-card">食品级环保循环杯</div>
<div class="cup-card">高硼硅玻璃颜值杯</div>
</div>
<div class="tab-bar">
<div class="tab-item active" onclick="go(1)">🏠首页</div>
<div class="tab-item" onclick="go(2)">🤖AI创杯</div>
<div class="tab-item" onclick="go(3)">💡投稿</div>
<div class="tab-item" onclick="go(4)">🛒杯型</div>
</div>
</div>
<script>
function go(n){document.querySelectorAll('.page-content').forEach(p=>p.classList.remove('active'));document.getElementById('page'+n).classList.add('active');document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-item')[n-1].classList.add('active')}
</script>
</body>
</html>
